name: Release

# Push a tag like v1.0.1 to build the installer and publish it as a GitHub release.
# Installed copies of ShiftDrop find the new version through "Check for updates" in Settings.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        shell: pwsh
        run: '"value=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_OUTPUT'

      # The previous release lets Velopack build a small delta update next to the full one.
      - name: Previous release
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir artifacts/releases
        continue-on-error: true

      - name: Build
        shell: pwsh
        run: ./scripts/release.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Publish
        shell: pwsh
        run: >
          dotnet vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir artifacts/releases
          --tag ${{ github.ref_name }}
          --releaseName "ShiftDrop ${{ steps.version.outputs.value }}"
          --publish
